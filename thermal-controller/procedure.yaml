name: Thermal Controller
version: 1.0.0

plugs:
  - key: controller
    name: Thermal controller
    python: plugs.thermal_controller:ThermalController

main:
  - key: cycle
    name: Thermal cycle
    python: phases.thermal_controller:thermal_cycle
    measurements:
      - key: cold_plateau
        name: Baseplate temperature in the cold dwell
        unit: "°C"
        validators:
          - operator: ">="
            expected_value: -32
          - operator: "<="
            expected_value: -28
      - key: hot_plateau
        name: Baseplate temperature in the hot dwell
        unit: "°C"
        validators:
          - operator: ">="
            expected_value: 58
          - operator: "<="
            expected_value: 62
    ui:
      panel: panels/controller.html
