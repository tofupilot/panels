name: Bin Pareto
version: 1.0.0

plugs:
  - key: lot_tester
    name: Wafer sort tester
    python: plugs.lot_tester:LotTester

main:
  - key: lot
    name: Lot sort
    python: phases.bin_pareto:bin_pareto
    measurements:
      - key: top_bin_share
        name: Share of fails in the leading bin
        unit: "%"
        validators:
          - operator: "<="
            expected_value: 50
      - key: lot_yield
        name: Lot yield
        unit: "%"
        validators:
          - operator: ">="
            expected_value: 90
    ui:
      panel: panels/pareto.html
