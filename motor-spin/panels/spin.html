<div class="stand">
  <div class="gauges">
    <figure class="gauge rpm" data-bind="ui.rpm">
      <svg viewBox="0 0 200 170">
        <path class="track" d="M40 150A80 80 0 1 1 160 150" pathLength="100"/>
        <path class="arc" d="M40 150A80 80 0 1 1 160 150" pathLength="100"/>
        <path class="redline" d="M40 150A80 80 0 1 1 160 150" pathLength="100"/>
      </svg>
      <figcaption>
        <b data-bind="ui.rpm" data-format="0"></b>
        <span>rpm</span>
      </figcaption>
    </figure>
    <figure class="gauge amps" data-bind="ui.amps">
      <svg viewBox="0 0 200 170">
        <path class="track" d="M40 150A80 80 0 1 1 160 150" pathLength="100"/>
        <path class="arc" d="M40 150A80 80 0 1 1 160 150" pathLength="100"/>
      </svg>
      <figcaption>
        <b data-bind="ui.amps" data-format="0.0"></b>
        <span>A</span>
      </figcaption>
    </figure>
  </div>

  <div class="steps" data-bind="ui.step">
    <span class="label">Throttle setpoints</span>
    <ol>
      <li style="--n: 1">20 %</li>
      <li style="--n: 2">40 %</li>
      <li style="--n: 3">60 %</li>
      <li style="--n: 4">80 %</li>
      <li style="--n: 5">100 %</li>
    </ol>
  </div>

  <div class="readouts">
    <div class="temp" data-bind="ui.temp">
      <span class="label">ESC temp</span>
      <b data-bind="ui.temp" data-format="0.0"></b> °C
      <div class="bar"><i></i></div>
    </div>
    <div class="chip" data-bind="measurements.max_rpm"><span>Full-throttle rpm</span><b data-bind="measurements.max_rpm" data-format="0"></b></div>
    <div class="chip" data-bind="measurements.peak_current"><span>Peak A</span><b data-bind="measurements.peak_current" data-format="0.0"></b></div>
    <div class="chip" data-bind="measurements.esc_temp"><span>ESC °C</span><b data-bind="measurements.esc_temp" data-format="0.0"></b></div>
  </div>
</div>
<style>
  .stand {
    display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 16px;
    background: #101215; color: #e8ecef; font-family: system-ui, sans-serif;
  }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8a949e; }
  .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .gauge { position: relative; margin: 0; padding: 12px; border-radius: 14px; background: #191d22; }
  .gauge svg { display: block; width: 100%; height: auto; }
  .gauge path { fill: none; stroke-width: 14; stroke-linecap: round; }
  .track { stroke: #262c33; }
  .arc { stroke: #4aa8ff; transition: stroke-dasharray .1s linear; }
  .rpm .arc { stroke-dasharray: calc(clamp(0, var(--value, 0), 12000) / 12000 * 100) 200; }
  .amps .arc { stroke: #f2c230; stroke-dasharray: calc(clamp(0, var(--value, 0), 40) / 40 * 100) 200; }
  .gauge .redline { stroke: #e5383b; stroke-width: 4; stroke-dasharray: 0 92 8 200; stroke-linecap: butt; }
  .gauge figcaption {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 24px;
  }
  .gauge figcaption b { font: 600 36px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .gauge figcaption span { color: #8a949e; font-size: 14px; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .steps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .steps li {
    padding: 10px 0; text-align: center; border-radius: 10px; font: 600 14px ui-monospace, Menlo, monospace;
    background: #4aa8ff; color: #0b1a29;
    opacity: clamp(.18, var(--value, 0) - var(--n) + 1, 1);
    transition: opacity .3s;
  }
  .readouts { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 12px; }
  .temp { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; padding: 10px 14px; border-radius: 10px; background: #191d22; }
  .temp .label { width: 100%; }
  .temp b { font: 600 20px ui-monospace, Menlo, monospace; }
  .temp .bar { width: 100%; height: 6px; border-radius: 3px; background: #262c33; overflow: hidden; }
  .temp .bar i { display: block; height: 100%; background: #f29b30; width: calc((clamp(20, var(--value, 20), 80) - 20) / 60 * 100%); }
  .chip {
    display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 10px 14px; border-radius: 10px;
    background: #191d22; border: 1px solid #262c33; font-size: 12px; color: #8a949e;
  }
  .chip b { font: 600 18px ui-monospace, Menlo, monospace; color: #e8ecef; }
  .chip[data-outcome=PASS] { border-color: #2f7d4f; background: #16271d; }
  .chip[data-outcome=PASS] b { color: #6fe3a0; }
  .chip[data-outcome=FAIL] { border-color: #8c2f2c; background: #2c1716; }
  .chip[data-outcome=FAIL] b { color: #ff8a84; }
</style>
