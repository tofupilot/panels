name: Cooling Fan Test
version: 1.0.0

main:
  - key: fan
    name: Spin up and measure
    python: phases.fan:spin
    measurements:
      - key: rpm
        name: Speed at full duty
        unit: rpm
        validators:
          - operator: ">="
            expected_value: 2800
          - operator: "<="
            expected_value: 3200
      - key: airflow
        name: Airflow
        unit: CFM
        validators:
          - operator: ">="
            expected_value: 40
      - key: noise
        name: Noise at 1 m
        unit: dB(A)
        validators:
          - operator: "<="
            expected_value: 38
    ui:
      panel: panels/fan.html
