<div class="inst" data-bind="ui.cycle_state">
  <div class="top"><span class="label">Baseplate</span><span class="aux" data-bind="ui.stage">—</span></div>
  <div class="value"><b data-bind="ui.temp" data-format="0.0">0.0</b><span>°C</span></div>
  <div class="tape">
    <i class="band" data-bind="ui.target"><s></s></i>
    <i class="mark cyan" style="left: 15.385%"></i>
    <i class="mark cyan" style="left: 84.615%"></i>
    <span class="fill-wrap" data-bind="ui.temp"><i class="fill" style="width: calc((clamp(-50, var(--value, -50), 80) + 50) / 130 * 100%)"></i></span>
  </div>
  <div class="scale"><span style="left: 0.000%">−50</span><span style="left: 15.385%">−30</span><span style="left: 38.462%">0</span><span style="left: 61.538%">30</span><span style="left: 84.615%">60</span><span style="left: 100.000%">80</span></div>
</div>
<style>
  .inst {
    --live: #4aa8ff;
    width: min(520px, 100%); margin: 0 auto; display: grid; gap: 14px;
    padding: 18px 20px 20px; border-radius: 14px; border: 1px solid #1f252b;
    background: #0d1014; color: #f2f4f6; font-family: system-ui, sans-serif;
  }
  .inst[data-value=warn] { --live: #f2c230; }
  .inst[data-value=alarm] { --live: #e5383b; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .label { font: 600 10px system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #7d8791; }
  .aux { font: 500 11px ui-monospace, Menlo, monospace; color: #7d8791; font-variant-numeric: tabular-nums; }
  .value { display: flex; align-items: baseline; gap: 6px; }
  .value b { font: 600 32px/1 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; transition: color .2s; }
  .value span { font: 600 11px system-ui, sans-serif; letter-spacing: .12em; color: #7d8791; }
  .inst[data-value=warn] .value b { color: #f2c230; }
  .inst[data-value=alarm] .value b { color: #ff8a84; }
  .scale { position: relative; height: 14px; font: 500 11px "Barlow Condensed", "Arial Narrow", sans-serif; color: #7d8791; }
  .scale span { position: absolute; top: 0; transform: translateX(-50%); }
  .scale span:first-child { transform: none; }
  .scale span:last-child { transform: translateX(-100%); }
  .tape { position: relative; height: 22px; }
  .tape::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: #22282f; }
  .tape i { position: absolute; display: block; }
  .fill { left: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--live); transition: width .2s linear, background-color .2s; }
  .mark { top: 4px; width: 2px; height: 14px; margin-left: -1px; z-index: 1; }
  .red { background: #e5383b; }
  .cyan { background: #22d3ee; }
  .amber { background: #f2c230; }
  .fill-wrap { position: absolute; inset: 0; }
  /* ±2 °C around the plateau being run: 4 °C wide on a 130 °C tape. */
  .band {
    top: 2px; height: 18px; border-radius: 3px; background: rgba(34, 211, 238, .18);
    left: calc((clamp(-50, var(--value, -50), 80) + 48) / 130 * 100% - 4 / 130 * 100%);
    width: calc(4 / 130 * 100%);
    transition: left .4s;
  }
  .band[data-value=none] { display: none; }
</style>
