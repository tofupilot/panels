name: Pack Current
version: 1.0.0

plugs:
  - key: cycler
    name: Battery cycler
    python: plugs.cycler:BatteryCycler

main:
  - key: current
    name: Charge and discharge
    python: phases.current:charge_and_discharge
    measurements:
      - key: cc_charge_current
        name: Constant-current charge current
        unit: "A"
        validators:
          - operator: ">="
            expected_value: 49
          - operator: "<="
            expected_value: 51
    ui:
      panel: panels/current.html
