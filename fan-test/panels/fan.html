<div class="fan" data-bind="ui.running">
  <div class="bench">
    <svg viewBox="0 0 420 220" role="img" aria-label="Fan on an airflow bench">
      <rect x="10" y="10" width="200" height="200" rx="16" fill="#1b1f24"/>
      <circle cx="30" cy="30" r="5" fill="#3a424b"/><circle cx="190" cy="30" r="5" fill="#3a424b"/>
      <circle cx="30" cy="190" r="5" fill="#3a424b"/><circle cx="190" cy="190" r="5" fill="#3a424b"/>
      <circle cx="110" cy="110" r="88" fill="#0c0e10" stroke="#2a3037" stroke-width="4"/>
      <g class="rotor">
        <path d="M110 110C100 80 104 50 122 32C134 56 130 86 110 110Z"/>
        <path d="M110 110C100 80 104 50 122 32C134 56 130 86 110 110Z" transform="rotate(72 110 110)"/>
        <path d="M110 110C100 80 104 50 122 32C134 56 130 86 110 110Z" transform="rotate(144 110 110)"/>
        <path d="M110 110C100 80 104 50 122 32C134 56 130 86 110 110Z" transform="rotate(216 110 110)"/>
        <path d="M110 110C100 80 104 50 122 32C134 56 130 86 110 110Z" transform="rotate(288 110 110)"/>
      </g>
      <circle cx="110" cy="110" r="18" fill="#2a3037"/>
      <circle cx="110" cy="110" r="6" fill="#4a525b"/>
      <g class="flow">
        <path d="M222 60H410"/>
        <path d="M222 92H410"/>
        <path d="M222 128H410"/>
        <path d="M222 160H410"/>
      </g>
    </svg>
  </div>

  <div class="side">
    <span class="state"></span>
    <div class="readout">
      <span class="label">Speed</span>
      <span class="big"><b data-bind="ui.rpm" data-format="0">0</b> rpm</span>
    </div>
    <div class="readout">
      <span class="label">Airflow</span>
      <span class="mid"><b data-bind="ui.airflow" data-format="0.0">0.0</b> CFM</span>
    </div>
  </div>

  <div class="results">
    <div class="chip" data-bind="measurements.rpm"><span>Speed</span><b data-bind="measurements.rpm" data-format="0"></b></div>
    <div class="chip" data-bind="measurements.airflow"><span>Airflow</span><b data-bind="measurements.airflow" data-format="0.0"></b></div>
    <div class="chip" data-bind="measurements.noise"><span>Noise dB(A)</span><b data-bind="measurements.noise" data-format="0.0"></b></div>
  </div>
</div>
<style>
  .fan {
    display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 16px; align-items: center;
    padding: 20px; border-radius: 16px; background: #101215; color: #e8ecef; font-family: system-ui, sans-serif;
  }
  .bench svg { display: block; width: 100%; height: auto; }

  /* Fixed loops: they run on their own and only start and stop with ui.running. */
  .rotor {
    fill: #8fa3b5;
    transform-box: view-box;
    transform-origin: 110px 110px;
    animation: fan-test-spin .35s linear infinite paused;
  }
  .flow path {
    fill: none; stroke: #4aa8ff; stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 10 22;
    opacity: .15;
    animation: fan-test-flow .5s linear infinite paused;
    transition: opacity .6s;
  }
  .flow path:nth-child(even) { animation-duration: .65s; }
  .fan[data-value=true] .rotor,
  .fan[data-value=true] .flow path { animation-play-state: running; }
  .fan[data-value=true] .flow path { opacity: .9; }
  @keyframes fan-test-spin { to { transform: rotate(360deg); } }
  @keyframes fan-test-flow { to { stroke-dashoffset: -32; } }

  .side { display: flex; flex-direction: column; gap: 12px; }
  .state {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .06em;
    background: #262c33; color: #8a949e;
  }
  .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .state::after { content: "STOPPED"; }
  .fan[data-value=true] .state { background: #16271d; color: #6fe3a0; }
  .fan[data-value=true] .state::before { animation: fan-test-blink 1s ease-in-out infinite; }
  .fan[data-value=true] .state::after { content: "RUNNING"; }
  @keyframes fan-test-blink { 50% { opacity: .2; } }

  .readout { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: #191d22; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8a949e; }
  .big, .mid { font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; color: #8a949e; white-space: nowrap; }
  .big b { font-size: 34px; font-weight: 600; color: #e8ecef; }
  .mid b { font-size: 22px; font-weight: 600; color: #e8ecef; }

  .results { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .chip {
    display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-radius: 10px;
    background: #191d22; border: 1px solid #262c33; font-size: 13px; color: #8a949e;
  }
  .chip b { font: 600 18px ui-monospace, Menlo, monospace; color: #e8ecef; }
  .chip[data-outcome=PASS] { border-color: #2f7d4f; background: #16271d; }
  .chip[data-outcome=PASS] b { color: #6fe3a0; }
  .chip[data-outcome=FAIL] { border-color: #8c2f2c; background: #2c1716; }
  .chip[data-outcome=FAIL] b { color: #ff8a84; }

  @media (prefers-reduced-motion: reduce) {
    .rotor, .flow path, .state::before { animation: none; }
  }
</style>
