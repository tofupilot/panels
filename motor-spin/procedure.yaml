name: Motor Spin Test
version: 1.0.0

main:
  - key: spin
    name: Throttle sweep
    python: phases.spin:sweep
    measurements:
      - key: max_rpm
        name: Speed at full throttle
        unit: rpm
        validators:
          - operator: ">="
            expected_value: 11000
      - key: peak_current
        name: Peak current
        unit: A
        validators:
          - operator: "<="
            expected_value: 32
      - key: esc_temp
        name: ESC temperature after sweep
        unit: °C
        validators:
          - operator: "<="
            expected_value: 70
    ui:
      panel: panels/spin.html
