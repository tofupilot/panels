name: Pack Voltage
version: 1.0.0

plugs:
  - key: cycler
    name: Battery cycler
    python: plugs.cycler:BatteryCycler

main:
  - key: voltage
    name: Charge and discharge
    python: phases.voltage:charge_and_discharge
    measurements:
      - key: cv_voltage
        name: Voltage held in CV
        unit: "V"
        validators:
          - operator: ">="
            expected_value: 54.5
          - operator: "<="
            expected_value: 54.7
      - key: end_of_discharge_voltage
        name: Lowest voltage of the discharge
        unit: "V"
        validators:
          - operator: ">="
            expected_value: 39.0
    ui:
      panel: panels/voltage.html
