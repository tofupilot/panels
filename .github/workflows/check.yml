name: Check examples

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the TofuPilot CLI
        run: |
          curl -fsSL https://www.tofupilot.app/install | sh
          for dir in "$HOME/.local/bin" "$HOME/.tofupilot/bin" /usr/local/bin; do echo "$dir" >> "$GITHUB_PATH"; done
      - name: Record every example
        # Runs each example on its mock and fails unless it passes.
        run: uv run --with pyyaml python scripts/record.py
      - name: Previews are up to date
        run: |
          python - <<'PY'
          import json, subprocess, sys
          changed = subprocess.run(["git", "diff", "--name-only"], capture_output=True, text=True).stdout.split()
          # Timings vary run to run; only a change in the panel's keys means a stale preview.
          stale = []
          for path in changed:
              if not path.endswith("preview.json"):
                  continue
              old = json.loads(subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, text=True).stdout)
              new = json.load(open(path))
              keys = lambda p: sorted({(e[1], e[2]) for e in p["events"]})
              if keys(old) != keys(new):
                  stale.append(path)
          if stale:
              sys.exit("Stale previews, run scripts/record.py: " + ", ".join(stale))
          PY
