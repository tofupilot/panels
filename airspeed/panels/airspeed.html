<style>
  .asi { display: flex; justify-content: center; padding: 0 16px; }
  .dial { position: relative; width: min(360px, 90vw); }

  .num { font: 700 15px "Barlow Condensed", "Arial Narrow", sans-serif; fill: #f2f4f6; text-anchor: middle; }
  .track, .arc { fill: none; stroke-width: 7; stroke-linecap: round; }
  .track { stroke: #22282f; }
  /* The sweep fills from 40 kt, the bottom of the scale, to the reading. */
  .arc {
    stroke: #4aa8ff;
    stroke-dasharray: calc((clamp(40, var(--value, 40), 200) - 40) / 160 * 100) 200;
    transition: stroke-dasharray .12s linear, stroke .2s;
  }
  .tip {
    fill: #f2f4f6;
    transform-box: view-box;
    transform-origin: 143px 112px;
    transform: rotate(calc((clamp(40, var(--value, 40), 200) - 120) * 2deg));
    transition: transform .12s linear, fill .2s;
  }
  .value {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    pointer-events: none;
  }
  .value b { font: 600 30px/1 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; color: #f2f4f6; transition: color .2s; }
  .value span { font: 600 10px system-ui, sans-serif; letter-spacing: .12em; color: #8a949e; }
  /* Past the red line the sweep, its tip and the reading turn red. */
  .asi[data-value=true] .arc { stroke: #e5383b; }
  .asi[data-value=true] .tip { fill: #e5383b; }
  .asi[data-value=true] .value b { color: #ff8a84; }
</style>
