name: Power Rails
version: 1.0.0

main:
  - key: rails
    name: Probe power rails
    python: phases.rails:probe
    measurements:
      - key: vin
        name: Input rail
        unit: V
        validators:
          - operator: ">="
            expected_value: 11.4
          - operator: "<="
            expected_value: 12.6
      - key: v5
        name: 5 V rail
        unit: V
        validators:
          - operator: ">="
            expected_value: 4.85
          - operator: "<="
            expected_value: 5.15
      - key: v3v3
        name: 3.3 V rail
        unit: V
        validators:
          - operator: ">="
            expected_value: 3.2
          - operator: "<="
            expected_value: 3.4
      - key: v1v8
        name: 1.8 V rail
        unit: V
        validators:
          - operator: ">="
            expected_value: 1.75
          - operator: "<="
            expected_value: 1.85
      - key: idle_current
        name: Idle current
        unit: mA
        validators:
          - operator: "<="
            expected_value: 180
    ui:
      panel: panels/rails.html
