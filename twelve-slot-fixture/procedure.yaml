name: Twelve-Slot Fixture
version: 1.0.0

plugs:
  - key: fixture_controller
    name: Fixture controller
    python: plugs.fixture_controller:FixtureController

main:
  - key: slots
    name: Parallel test
    python: phases.twelve_slot_fixture:parallel_test
    measurements:
      - key: first_pass_yield
        name: First-pass yield
        unit: "%"
        validators:
          - operator: ">="
            expected_value: 90
      - key: boards_passed
        name: Boards passed
        unit: ""
        validators:
          - operator: ">="
            expected_value: 12
    ui:
      panel: panels/fixture.html
