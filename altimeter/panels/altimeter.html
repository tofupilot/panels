<style>
  .inst { display: flex; justify-content: center; padding: 0 16px; }
  .dial { position: relative; width: min(360px, 90vw); }

  .num { font: 700 15px "Barlow Condensed", "Arial Narrow", sans-serif; fill: #f2f4f6; text-anchor: middle; dominant-baseline: central; }
  .cap { font: 600 7px system-ui, sans-serif; fill: #8a949e; text-anchor: middle; letter-spacing: .12em; }
  .readout {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    pointer-events: none;
  }
  .readout b { font: 600 30px/1 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; color: #f2f4f6; transition: color .2s; }
  .readout span { font: 600 10px system-ui, sans-serif; letter-spacing: .12em; color: #8a949e; }
  .track, .arc { fill: none; stroke-width: 7; stroke-linecap: round; }
  .track { stroke: #22282f; }
  .arc { stroke: #4aa8ff; transition: stroke-dasharray .12s linear, stroke .2s; }
  .tip { fill: #f2f4f6; transform-box: view-box; transform-origin: 143px 112px; transition: transform .12s linear, fill .2s; }
  /* The sweep fills from 0 ft to the reading; the cyan bug marks the selected altitude. */
  .arc { stroke-dasharray: calc(clamp(0, var(--value, 0), 10000) / 10000 * 100) 200; }
  .tip { transform: rotate(calc(clamp(0, var(--value, 0), 10000) / 10000 * 320deg - 160deg)); }
  .bug {
    fill: #22d3ee;
    transform-box: view-box;
    transform-origin: 143px 112px;
    transform: rotate(calc(clamp(0, var(--value, 0), 10000) / 10000 * 320deg - 160deg));
    transition: transform .2s;
  }
</style>
