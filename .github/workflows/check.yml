name: Check examples

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned: a CLI release never turns this repository red on its own.
  # Raise it on purpose, with the previews recorded again.
  TOFUPILOT_CLI_VERSION: "2.8.0"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the TofuPilot CLI
        run: |
          curl -fsSL https://www.tofupilot.app/install | sh -s -- --version "$TOFUPILOT_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run and record every example
        # Fails unless every example passes on its mocks.
        run: uv run --with pyyaml python scripts/record.py
      - name: Previews are up to date
        run: python scripts/check_previews.py
