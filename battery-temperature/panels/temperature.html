<div class="inst" data-bind="ui.temp_state">
  <div class="top"><span class="label">Max temp</span><span class="aux" data-bind="ui.hot">—</span></div>
  <div class="value"><b data-bind="ui.tmax" data-format="0.0">0.0</b><span>°C</span><small>Δ <em data-bind="ui.spread" data-format="0.0">0.0</em></small></div>
  <div class="plot" data-bind="ui.charging">
    <i class="seg warn"></i><i class="seg alarm"></i>
    <span class="dot" data-bind="ui.t1"><i></i></span>
    <span class="dot" data-bind="ui.t2"><i></i></span>
    <span class="dot" data-bind="ui.t3"><i></i></span>
    <span class="dot" data-bind="ui.t4"><i></i></span>
    <span class="dot" data-bind="ui.t5"><i></i></span>
    <span class="dot" data-bind="ui.t6"><i></i></span>
    <span class="dot" data-bind="ui.t7"><i></i></span>
    <span class="dot" data-bind="ui.t8"><i></i></span>
  </div>
  <div class="scale"><span style="left: 0.000%">10</span><span style="left: 25.000%">25</span><span style="left: 50.000%">40</span><span style="left: 75.000%">55</span><span style="left: 100.000%">70</span></div>
</div>
<style>
  .inst {
    --live: #4aa8ff;
    width: min(520px, 100%); margin: 0 auto; display: grid; gap: 14px;
    padding: 18px 20px 20px; border-radius: 14px; border: 1px solid #1f252b;
    background: #0d1014; color: #f2f4f6; font-family: system-ui, sans-serif;
  }
  .inst[data-value=warn] { --live: #f2c230; }
  .inst[data-value=alarm] { --live: #e5383b; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .label { font: 600 10px system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #7d8791; }
  .aux { font: 500 11px ui-monospace, Menlo, monospace; color: #7d8791; font-variant-numeric: tabular-nums; }
  .value { display: flex; align-items: baseline; gap: 6px; }
  .value b { font: 600 32px/1 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; transition: color .2s; }
  .value span { font: 600 11px system-ui, sans-serif; letter-spacing: .12em; color: #7d8791; }
  .inst[data-value=warn] .value b { color: #f2c230; }
  .inst[data-value=alarm] .value b { color: #ff8a84; }
  .scale { position: relative; height: 14px; font: 500 11px "Barlow Condensed", "Arial Narrow", sans-serif; color: #7d8791; }
  .scale span { position: absolute; top: 0; transform: translateX(-50%); }
  .scale span:first-child { transform: none; }
  .scale span:last-child { transform: translateX(-100%); }
  .value small { margin-left: 10px; font: 500 14px ui-monospace, Menlo, monospace; color: #7d8791; }
  .value em { font-style: normal; }
  /* One 10–70 °C scale for all eight thermistors. Charging limit 45 °C,
     discharging limit 60 °C, amber 5 °C before each. */
  .plot { position: relative; height: 22px; }
  .plot::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #2a3037; }
  .seg { position: absolute; top: 10px; height: 2px; }
  .seg.warn { background: #f2c230; left: 75%; width: 8.333%; }
  .seg.alarm { background: #e5383b; left: 83.333%; right: 0; }
  .plot[data-value=true] .seg.warn { left: 50%; }
  .plot[data-value=true] .seg.alarm { left: 58.333%; }
  .dot {
    position: absolute; top: 6px; width: 10px; height: 10px; margin-left: -5px;
    left: calc((clamp(10, var(--value, 10), 70) - 10) / 60 * 100%);
    transition: left .2s linear;
  }
  .dot i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--live); opacity: .75; transition: background-color .2s; }
</style>
